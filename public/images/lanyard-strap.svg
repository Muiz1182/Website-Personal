<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <rect width="400" height="100" fill="#111114" />
  
  <!-- Subtle stitch line on edges -->
  <line x1="0" y1="8" x2="400" y2="8" stroke="#222228" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="0" y1="92" x2="400" y2="92" stroke="#222228" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Repeating Icon and Studio Text -->
  <g transform="translate(40, 50)">
    <circle r="22" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <circle r="14" fill="none" stroke="#FF5722" stroke-width="2" />
    <circle r="4" fill="#FFFFFF" />
  </g>

  <text x="85" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="4">MMA PRODUCTION</text>

  <g transform="translate(350, 50)">
    <circle r="18" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FF5722" stroke-width="3" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FF5722" stroke-width="3" />
  </g>
</svg>
