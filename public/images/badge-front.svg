      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
