      <stop offset="25%" stop-color="#FFD54F" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#26C6DA" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#AB47BC" stop-opacity="0.8"/>
